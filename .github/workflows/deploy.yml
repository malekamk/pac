name: Deploy to Xneelo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over FTPS to Xneelo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XNEELO_FTP_SERVER }}
          username: ${{ secrets.XNEELO_FTP_USERNAME }}
          password: ${{ secrets.XNEELO_FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.XNEELO_FTP_TARGET_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
