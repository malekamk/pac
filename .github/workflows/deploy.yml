name: Deploy to Xneelo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage deploy folder (exclude repo-only files)
        run: |
          mkdir -p deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='.env*' \
            --exclude='schema.sql' \
            --exclude='migrate.php' \
            --exclude='router.local.php' \
            --exclude='README*' \
            ./ deploy/

      # The SFTP action's local_path glob (deploy/*) does not match dotfiles,
      # so .htaccess and .env would silently never upload. Create remote
      # directories and push both explicitly here before the main upload
      # runs. .env is built fresh from secrets — it's git-ignored and never
      # lives in the repo or the runner beyond this one ephemeral file.
      - name: Ensure remote directories exist & upload .htaccess + .env
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          cat > remote.env << EOF
          DB_HOST=${{ secrets.XNEELO_DB_HOST }}
          DB_PORT=${{ secrets.XNEELO_DB_PORT }}
          DB_NAME=${{ secrets.XNEELO_DB_NAME }}
          DB_USER=${{ secrets.XNEELO_DB_USER }}
          DB_PASS=${{ secrets.XNEELO_DB_PASS }}
          SITE_DOMAIN=${{ secrets.XNEELO_SITE_DOMAIN }}
          EOF

          REMOTE_DIRS="admin assets assets/img assets/img/uploads css js partials"
          BATCH=$(for d in $REMOTE_DIRS; do echo "-mkdir ${{ secrets.XNEELO_FTP_TARGET_DIR }}$d"; done)
          BATCH="$BATCH
          put deploy/.htaccess ${{ secrets.XNEELO_FTP_TARGET_DIR }}.htaccess
          put remote.env ${{ secrets.XNEELO_FTP_TARGET_DIR }}.env"
          echo "$BATCH" | sshpass -p "${{ secrets.XNEELO_FTP_PASSWORD }}" \
            sftp -o StrictHostKeyChecking=no -P 22 \
            "${{ secrets.XNEELO_FTP_USERNAME }}@${{ secrets.XNEELO_FTP_SERVER }}"

          rm -f remote.env

      - name: Deploy over SFTP to Xneelo
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.XNEELO_FTP_USERNAME }}
          server: ${{ secrets.XNEELO_FTP_SERVER }}
          port: 22
          password: ${{ secrets.XNEELO_FTP_PASSWORD }}
          local_path: 'deploy/*'
          remote_path: ${{ secrets.XNEELO_FTP_TARGET_DIR }}
          sftp_only: true
